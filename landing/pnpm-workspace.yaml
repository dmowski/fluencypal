packages:
  - .

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true

blockExoticSubdeps: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyExclude:
  - ua-parser-js

overrides:
  # braces 3.0.4 is not published. Local build rejects deeply nested patterns.
  braces: 'file:../third_party/braces'
  # semver@6.3.1 has no provenance while older 6.x builds do, so pnpm blocks it
  # as a trust downgrade. Babel still requests semver 6.
  semver: ^7.7.3
  # js-yaml 3 pulls argparse 1 and the unfixed sprintf-js advisory. 4.3.2 is the patched 4.x line.
  'js-yaml@<4.3.2': '>=4.3.2'
