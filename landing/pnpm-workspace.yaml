packages:
  - .

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

blockExoticSubdeps: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyExclude:
  - ua-parser-js

overrides:
  '@lingui/loader>webpack': '5.104.1'
  valibot: '^1.2.0'
  rollup: '^4.59.0'
  webpack: '^5.104.1'
  serialize-javascript: '^7.0.3'
  fast-xml-parser: '^5.5.7'
  '@tootallnate/once': '^3.0.1'
  'glob@10>minimatch': '^9.0.7'
  'schema-utils@2>ajv': '^6.14.0'
  'schema-utils@4>ajv': '^8.18.0'
  'react-string-diff>diff': '^4.0.4'
  handlebars: '^4.7.9'
  basic-ftp: '^5.3.1'
  postcss@<=8.5.17: ^8.5.18
  yaml: '>=2.8.3'
  esbuild: '>=0.28.1'
  ws: '>=8.21.0'
  js-yaml@<4.3.0: '>=4.3.0'
  js-yaml@>=5.0.0 <=5.2.1: '>=5.2.2'
  fast-uri: 4.1.2
  brace-expansion@<1.1.16: '>=1.1.16'
  brace-expansion@>=2.0.0 <2.1.2: '>=2.1.2'
  brace-expansion@>=3.0.0 <5.0.9: '>=5.0.9'
  brace-expansion: ^5.0.9
  sharp@<0.35.0: ^0.35.2
  protobufjs: '>=7.6.5'
  '@opentelemetry/core': '>=2.8.0'
  semver: '^7.0.0'
  nanoid@<3.3.17: ^3.3.17

minimumReleaseAgeExclude:
  - fast-uri@4.1.2
  - brace-expansion@5.0.9
  - nanoid@3.3.17
