  'react-string-diff>diff': '^4.0.4'
  handlebars: '^4.7.9'
  basic-ftp: '^5.3.1'
  postcss@<=8.5.17: ^8.5.18
  yaml: '>=2.8.3'
  esbuild: '>=0.28.1'
