packages:
  - .

allowBuilds:
  '@firebase/util': true
  '@sentry/cli': true
  core-js-pure: true
  es5-ext: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

overrides:
  '@lingui/loader>webpack': 5.104.1
  rollup: ^4.59.0
  webpack: ^5.104.1
  serialize-javascript: ^7.0.3
  fast-xml-parser: ^5.5.7
  'glob@10>minimatch': ^9.0.7
  'schema-utils@2>ajv': ^6.14.0
  'schema-utils@4>ajv': ^8.18.0
  'react-string-diff>diff': ^4.0.4
  ua-parser-js: ^2.0.9
  vite: ^7.3.3
  handlebars: ^4.7.9
  protobufjs: '>=7.6.3'
  basic-ftp: ^5.3.1
  jwks-rsa: ^4.0.1
  reselect: ^5.2.0
  semver: ^7.7.3
  # Security patches - scoped to only override vulnerable version ranges
  '@tootallnate/once@<3.0.1': ^3.0.1
  postcss@<8.5.10: ^8.5.10
  valibot@>=0.31.0 <1.2.0: ^1.2.0
  yaml@>=2.0.0 <2.8.3: ^2.8.3
  esbuild@>=0.17.0 <0.28.1: '>=0.28.1'
  ws@>=8.0.0 <8.21.0: '>=8.21.0'
  uuid@<11.1.1: '>=11.1.1'
  js-yaml@<=4.1.1: '>=4.2.0'
  '@opentelemetry/core@<2.8.0': '>=2.8.0'
  '@grpc/grpc-js@>=1.14.0 <1.14.4': '>=1.14.4'
  form-data@<2.5.6: '>=2.5.6'

blockExoticSubdeps: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyExclude:
  - ua-parser-js
patchedDependencies:
  ua-parser-js@2.0.10: patches/ua-parser-js@2.0.10.patch
