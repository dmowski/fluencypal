packages:
  - .

allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@sentry/cli': true
  core-js-pure: true
  es5-ext: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

overrides:
  # braces 3.0.4 is not published. Local build rejects deeply nested patterns.
  braces: 'file:../third_party/braces'
  # semver@6.3.1 has no provenance while older 6.x builds do, so pnpm blocks it
  # as a trust downgrade. Babel still requests semver 6.
  semver: ^7.7.3
  # jwks-rsa@4 pulls jose@6 (ESM-only). Vercel's runtime disables require(esm) unless
  # NODE_OPTIONS=--experimental-require-module is set, which breaks firebase-admin auth.
  jwks-rsa: 3.2.2
  # uuid@12+ is ESM-only; google-gax/firebase use require('uuid') and break on Vercel.
  uuid: 11.1.1
  # Prereleases (e.g. 1.0.0-beta.14) do not match numeric ranges, so pin all valibot.
  valibot: ^1.4.2
  # Parents still request vulnerable ranges. These are the minimum patched releases.
  'yaml@>=2.0.0 <2.8.3': ^2.8.3
  'js-yaml@<4.3.2': '>=4.3.2'
  '@grpc/grpc-js@<1.14.5': '>=1.14.5'

blockExoticSubdeps: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyExclude:
  - ua-parser-js
  - jose
  - uuid
